[project]
name = "pdf2tables"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexander Wyss",email = "alexander.wyss@roche.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "dash (>=3.0.4,<4.0.0)",
    "amazon-textract-response-parser (>=1.0.3,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "pymupdf (>=1.26.1,<2.0.0)",
    "amazon-textract-textractor (>=1.9.2,<2.0.0)",
    "pdf2image (>=1.17.0,<2.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "langchain-google-genai (>=2.1.5,<3.0.0)",
    "langchain (>=0.3.26,<0.4.0)",
    "certifi (>=2025.6.15,<2026.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "shap (>=0.48.0,<0.49.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
